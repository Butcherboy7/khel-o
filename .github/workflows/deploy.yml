name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]

permissions:
  id-token: write   # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deploy target
        id: target
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "dir=/opt/khelo-prod" >> "$GITHUB_OUTPUT"
            echo "env=prod" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "dev" ]; then
            echo "dir=/opt/khelo-dev" >> "$GITHUB_OUTPUT"
            echo "env=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown branch: $BRANCH" >&2
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263839541112:role/khelo-github-deploy
          aws-region: ap-south-1

      - name: Trigger deploy on EC2 via SSM
        id: send
        run: |
          DIR="${{ steps.target.outputs.dir }}"
          ENVIRONMENT="${{ steps.target.outputs.env }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0098e44a41a17ac8e \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy ($ENVIRONMENT): ${{ github.event.workflow_run.head_sha }}" \
            --parameters commands="[\"cd $DIR && git fetch origin $BRANCH && git reset --hard origin/$BRANCH\", \"bash $DIR/scripts/deploy_remote.sh $ENVIRONMENT\"]" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id i-0098e44a41a17ac8e \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- stdout ---"
              aws ssm get-command-invocation \
                --command-id "${{ steps.send.outputs.command_id }}" \
                --instance-id i-0098e44a41a17ac8e \
                --query "StandardOutputContent" --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation \
                --command-id "${{ steps.send.outputs.command_id }}" \
                --instance-id i-0098e44a41a17ac8e \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command to finish"
          exit 1
