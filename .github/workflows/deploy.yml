name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}   # TEMP: manual trigger for OIDC debugging, remove once resolved

permissions:
  id-token: write   # required to mint the OIDC token for AssumeRoleWithWebIdentity
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # TEMP debug step: prints the actual sub/aud claims GitHub issues so we
      # can match the IAM trust policy condition to reality instead of
      # guessing. Remove once the OIDC assume-role issue is resolved.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64 padding fix, then decode
          PAYLOAD="${PAYLOAD//-/+}"; PAYLOAD="${PAYLOAD//_/\/}"
          MOD=$(( ${#PAYLOAD} % 4 )); if [ "$MOD" -ne 0 ]; then PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $((4-MOD))))"; fi
          echo "$PAYLOAD" | base64 -d | python3 -m json.tool

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::263839541112:role/khelo-github-deploy
          aws-region: ap-south-1

      - name: Trigger deploy on EC2 via SSM
        id: send
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0098e44a41a17ac8e \
            --document-name AWS-RunShellScript \
            --comment "GitHub Actions deploy: ${{ github.event.workflow_run.head_sha }}" \
            --parameters commands='["cd /opt/khelo && git fetch origin main && git reset --hard origin/main", "bash /opt/khelo/scripts/deploy_remote.sh"]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id i-0098e44a41a17ac8e \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- stdout ---"
              aws ssm get-command-invocation \
                --command-id "${{ steps.send.outputs.command_id }}" \
                --instance-id i-0098e44a41a17ac8e \
                --query "StandardOutputContent" --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation \
                --command-id "${{ steps.send.outputs.command_id }}" \
                --instance-id i-0098e44a41a17ac8e \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command to finish"
          exit 1
