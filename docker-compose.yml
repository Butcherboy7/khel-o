services:
  postgres:
    image: postgres:15-alpine
    container_name: khel_o_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: khel_o_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khel_o_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khel_o_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/khel_o_db
      - SECRET_KEY=dev-secret-key-must-be-changed-in-production-12345
      - FRONTEND_URL=http://localhost:3002
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-google-client-id}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mock_khelo_key}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mock_razorpay_secret}
    volumes:
      - qrdata:/app/static/qr
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khel_o_frontend
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-your-google-client-id}
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_mock_khelo_key}
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: khel_o_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@khelo.in
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  qrdata:
